<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dashboard — Kendberg</title>
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" type="image/png" href="assets/favicon-k.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav solid">
    <div class="nav__in">
      <a href="/" class="brand" aria-label="Kendberg home">
        <img class="brand__k" src="assets/k-logo-sm.webp" alt="" width="34" height="30"><span>Kendberg</span>
      </a>
      <a href="/admin" class="pill nav__cta" id="admin-link" hidden>Admin</a>
      <button type="button" class="pill nav__cta" id="logout">Log out</button>
    </div>
  </header>

  <main class="page wrap" id="dash" style="visibility:hidden">
    <header class="dash-head">
      <div>
        <p class="mono">Dashboard</p>
        <h1 class="h2 h2--sm">Welcome, <em id="who"></em></h1>
      </div>
      <div class="dash-cur">
        <p class="mono"><i aria-hidden="true"></i>Latest report</p>
        <h2 id="cur-title">No reports yet</h2>
        <div class="bar" id="cur-bar" hidden>
          <span class="mono" id="cur-date"></span>
          <select class="sheet-pick" id="sheet-pick" aria-label="Sheet" hidden></select>
          <button type="button" class="pill" id="cur-dl">Download</button>
        </div>
      </div>
    </header>

    <section class="panel">
      <div class="bar" id="led-scope" hidden>
        <span class="mono" id="led-scope-name"></span>
        <button type="button" class="pill" id="led-all">Show overall</button>
      </div>
      <div class="led" id="ledger" hidden></div>
      <details class="table-toggle" id="sheet-box" hidden><summary class="mono">View full table</summary>
        <div class="sheet" id="sheet"></div>
      </details>
    </section>

    <section class="panel">
      <p class="mono">Past reports</p>
      <ul class="rows" id="past"><li class="empty">None yet.</li></ul>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="auth.js"></script>
  <script src="ledger.js"></script>
  <script>
    // ponytail: client-side guard only; the reports bucket itself is protected by storage RLS (logged-in users only).
    const $ = id => document.getElementById(id);
    let wb = null, current = null, overall = null; // overall = { tx, at }: every ledger merged
    const books = {}; // report name → workbook promise, so each file downloads once
    const book = name => books[name] ||= sb.storage.from('reports').download(name)
      .then(({ data, error }) => { if (error) throw error; return data.arrayBuffer(); }).then(b => XLSX.read(b));
    const firstSheet = w => XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]]);

    function renderSheet() {
      // sheet_to_html escapes cell values.
      $('sheet').innerHTML = XLSX.utils.sheet_to_html(wb.Sheets[$('sheet-pick').value], { header: '', footer: '' });
    }

    function showOverall() {
      $('led-scope').hidden = true;
      $('ledger').hidden = !overall || !renderLedger($('ledger'), overall.tx, overall.at);
    }

    // single: also swap the dashboard to just this file (the View button); otherwise only the table changes.
    async function show(file, single) {
      current = file;
      $('cur-title').textContent = reportName(file.name);
      $('cur-date').textContent = fmtDate(file.created_at);
      $('cur-bar').hidden = false;
      document.querySelectorAll('#past li').forEach(li => li.classList.toggle('on', li.dataset.name === file.name));
      try {
        wb = await book(file.name);
        const tx = txRows(firstSheet(wb));
        $('sheet-box').open = !tx; // ledgers are summarised above; other reports open straight to the table
        if (single && tx) {
          renderLedger($('ledger'), tx, file.created_at, true);
          $('ledger').hidden = false;
          $('led-scope-name').textContent = 'Showing ' + reportName(file.name) + ' only';
          $('led-scope').hidden = false;
        } else if (single) showOverall();
        $('sheet-pick').replaceChildren(...wb.SheetNames.map(n => new Option(n, n)));
        $('sheet-pick').hidden = wb.SheetNames.length < 2;
        renderSheet();
        $('sheet-box').hidden = false;
      } catch (e) { $('sheet-box').hidden = true; toast('Could not open this report: ' + e.message); }
    }

    $('sheet-pick').addEventListener('change', renderSheet);
    $('led-all').addEventListener('click', showOverall);
    $('cur-dl').addEventListener('click', () => downloadReport(current.name).catch(e => toast(e.message)));
    $('logout').addEventListener('click', async () => { await sb.auth.signOut(); location.replace('/'); });

    sb.auth.getSession().then(async ({ data }) => {
      const user = data.session?.user;
      if (!user) return location.replace('/login');
      $('who').textContent = user.user_metadata?.name || user.email;
      $('admin-link').hidden = !isAdmin(user);
      $('dash').style.visibility = '';

      try {
        const files = await listReports();
        if (!files.length) return;
        $('past').replaceChildren(...files.map(f => {
          const li = reportRow(reportName(f.name), fmtDate(f.created_at), [
            ['View', () => { show(f, true); scrollTo({ top: 0, behavior: 'smooth' }); }],
            ['Download', () => downloadReport(f.name).catch(e => toast(e.message))],
          ]);
          li.dataset.name = f.name;
          return li;
        }));
        show(files[0]);
        // Investor view: every ledger upload merged into one timeline (files are newest first; merge wants oldest first).
        // ponytail: downloads every report on each visit; fine for a few hundred small files.
        const ledgers = (await Promise.all(files.map(f => book(f.name).then(w => ({ f, tx: txRows(firstSheet(w)) }), () => null)))).filter(l => l?.tx);
        if (ledgers.length) overall = { tx: mergeLedgers(ledgers.map(l => l.tx).reverse()), at: ledgers[0].f.created_at };
        if ($('led-scope').hidden) showOverall(); // unless a View click already picked one file
      } catch (e) { toast('Could not load reports: ' + e.message); }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Login — Kendberg</title>
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" type="image/png" href="assets/favicon-k.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="nav solid">
    <div class="nav__in">
      <a href="/" class="brand" aria-label="Kendberg home">
        <img class="brand__k" src="assets/k-logo-sm.webp" alt="" width="34" height="30"><span>Kendberg</span>
      </a>
      <a href="/about" class="nav__plain">About</a>
      <a href="/contact" class="nav__plain">Contact</a>
      <a href="/login" class="pill nav__cta" aria-current="page">Login</a>
    </div>
  </header>

  <main class="auth wrap">
    <h1 class="h2">Login</h1>
    <form class="form" id="login" method="post">
      <label class="f"><input type="email" name="email" required autocomplete="email"
          placeholder=" "><span>Email</span></label>
      <label class="f"><input type="password" name="password" required autocomplete="current-password"
          placeholder=" "><span>Password</span></label>
      <button class="btn" type="submit"><span>Log in</span><i aria-hidden="true">→</i></button>
    </form>
    <p class="body"><button type="button" class="ulink" id="forgot">Forgot password?</button></p>
    <p class="body">Access by <a class="ulink" href="/contact">Invite</a> only</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('login');

    sb.auth.getSession().then(({ data }) => { if (data.session) location.replace('/dashboard'); });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = form.querySelector('button');
      btn.disabled = true;
      const { error } = await sb.auth.signInWithPassword({ email: form.email.value.trim(), password: form.password.value });
      btn.disabled = false;
      if (error) return toast(error.message);
      location.replace('/dashboard');
    });

    // Same message whether or not the account exists, so this can't be used to probe emails.
    document.getElementById('forgot').addEventListener('click', async e => {
      const email = form.email.value.trim();
      if (!form.email.checkValidity() || !email) return toast('Enter your email above first.');
      e.target.disabled = true;
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/reset' });
      e.target.disabled = false;
      toast(error ? error.message : 'If that email has an account, a reset link is on its way.');
    });
  </script>
</body>

</html>
